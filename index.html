#app [hidden],.gr-card [hidden]{display:none!important}
.gr-intro{max-width:70ch}

.gr-main{position:relative}
.gr-tabs{display:flex;flex-wrap:wrap;margin:10px 0 6px}
.gr-tabs .btn{margin:0 8px 8px 0;min-height:44px}
.gr-box{position:relative;margin:8px 0;min-width:0}
.gr-box h3{margin:1.1em 0 .4em}
.gr-bar{display:flex;flex-wrap:wrap;align-items:flex-end;margin:10px 0}

.gr-f{display:flex;flex-direction:column;font-size:.88rem;color:var(--mut);min-width:0;max-width:100%;margin:0 12px 10px 0}

.gr-count{color:var(--mut);margin:.6em 0;max-width:80ch}

.gr-sel{font-weight:650;margin:.5em 0}
.gr-list{list-style:none;margin:8px 0;padding:0;max-width:80ch}
.gr-item{position:relative;margin:10px 0;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;background:var(--card);overflow-wrap:anywhere}
.gr-box [tabindex="-1"]:focus{outline:3px solid var(--ac);outline-offset:2px}
.gr-meta{color:var(--mut);font-size:.88rem;margin:.2em 0}
.gr-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.8rem;color:var(--tx);background:var(--bg2)}
.gr-type{font-weight:650}

.gr-st-reviewed{border-color:#2e9d4a;font-weight:650}
.gr-yours{border-style:dashed}
.gr-text{font-size:1.1rem;white-space:pre-wrap;margin:.4em 0}
.gr-ans,.gr-purpose,.gr-tr{margin:.4em 0}
.gr-tr{color:var(--mut)}
.gr-reveal{min-height:44px;margin:.2em 0}
.gr-note{font-size:.88rem;color:var(--mut);border-left:3px solid var(--line);padding-left:10px;margin:.5em 0}
.gr-notes{margin:.4em 0;color:var(--mut);white-space:pre-wrap}
.gr-src{position:relative;font-size:.86rem;color:var(--mut);margin:.4em 0;overflow-wrap:anywhere}
.gr-sr,.gr-file{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gr-filelab{cursor:pointer}
.gr-file:focus+.gr-filelab{outline:3px solid var(--ac);outline-offset:2px}
.gr-file:focus-visible+.gr-filelab{outline:3px solid var(--ac);outline-offset:2px}
.gr-more summary{cursor:pointer;font-weight:650;min-height:32px;margin:6px 0}
.gr-more .gr-f{margin-top:6px}
.gr-chk{max-width:80ch;margin:.4em 0;min-height:1.5em}
.gr-own-box{margin-top:1em}
.gr-custom{list-style:none;margin:8px 0;padding:0;max-width:80ch}
.gr-custom li{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.gr-cid{font-weight:650}
.gr-cmeta{color:var(--mut)}
.gr-custom .btn{min-height:40px;padding:6px 14px;margin:6px 8px 0 0}
.gr-dup{max-width:80ch;margin:.6em 0}
.gr-steps{margin:.4em 0 .6em 1.4em;padding:0;max-width:80ch}
.gr-steps li{margin:.4em 0}
.gr-list-lim{max-width:80ch}
.gr-bad{color:#ffb4ab}
:root[data-theme="light"] .gr-bad{color:#8c1d18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gr-bad{color:#8c1d18}}
.gr-ok{color:#9be3a8;font-weight:650}
:root[data-theme="light"] .gr-ok{color:#14591f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .gr-ok{color:#14591f}}

/* harta schematică: 42 de plăci. Fără CSS Grid plăcile curg pe rânduri, în ordinea citirii; cu Grid, fiecare stă la coloana și rândul ei. */
.gr-grid{display:flex;flex-wrap:wrap;max-width:46rem;margin:10px 0}
.gr-tile{position:relative;display:block;box-sizing:border-box;width:44px;min-height:44px;margin:0 6px 6px 0;padding:3px 2px 6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;text-align:center;cursor:pointer;overflow:hidden}
.gr-tile:hover{border-color:var(--ac)}
.gr-tc{display:block;font-weight:750;font-size:.82rem;line-height:1.15}
.gr-tn{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gr-tk{display:block;font-size:.72rem;color:var(--mut);line-height:1.15}
.gr-d0{border-style:dashed}
.gr-d1{box-shadow:inset 0 -2px 0 var(--ac)}
.gr-d2{box-shadow:inset 0 -4px 0 var(--ac)}
.gr-d3{box-shadow:inset 0 -6px 0 var(--ac)}
.gr-d4{box-shadow:inset 0 -8px 0 var(--ac)}
.gr-on{border-color:var(--ac);outline:3px solid var(--ac);outline-offset:1px;background:var(--bg2)}
@supports (display:grid){
.gr-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-gap:5px}
.gr-tile{width:auto;min-width:0;margin:0}
.gr-c0{grid-column:1}.gr-c1{grid-column:2}.gr-c2{grid-column:3}.gr-c3{grid-column:4}.gr-c4{grid-column:5}.gr-c5{grid-column:6}.gr-c6{grid-column:7}.gr-c7{grid-column:8}.gr-c8{grid-column:9}
.gr-r0{grid-row:1}.gr-r1{grid-row:2}.gr-r2{grid-row:3}.gr-r3{grid-row:4}.gr-r4{grid-row:5}.gr-r5{grid-row:6}.gr-r6{grid-row:7}.gr-r7{grid-row:8}
}
@media (min-width:720px){
.gr-tile{min-height:60px}
.gr-tn{position:static;display:block;width:auto;height:auto;margin:0;clip:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.68rem;line-height:1.15;color:var(--mut)}
.gr-tc{font-size:.95rem}
}
@media (max-width:860px){.gr-inp{min-width:80px}}

ea; repetă pentru fiecare intrare.","gd_4":"Deschide fila Export și descarcă intrările ca fișier de contribuție; trimite-l într-un issue sau un pull request. Un responsabil îl importă cu scripts/import_bundle.py.","gd_5":"Preferi fișiere? Copiază data/items/example.json, completează-l, numește-l data/items/<limbă>-<primele cuvinte>.json și rulează python scripts/validate.py.","gd_eth_h":"Culegere etică","gd_eth_1":"Întreabă mai întâi: spune-i celui care îți spune un text că va fi publicat cu sursa lui, sub ce licență, și că poate refuza sau cere să rămână nenumit.","gd_eth_2":"Notează răspunsul în intrare: informed înseamnă că purtătorul a fost de acord, anonymised că a fost de acord fără nume, published că textul vine dintr-o lucrare publicată. Descântecele cer mereu una dintre cele trei.","gd_eth_3":"Respectă ce vrea purtătorul să rămână privat: unele descântece se transmit doar anumitor persoane sau în anumite momente; dacă ți se cere să nu publici, nu publica.","gd_eth_4":"Copiază doar ce ai voie: lucrări din domeniul public cu citarea lor, propriile culegeri sau intrări pentru care ai permisiune. Nu copia întreagă o culegere modernă.","gd_eth_5":"Un descântec se arată ca patrimoniu. Scrie scopul lui în câteva cuvinte; nu-l prezenta niciodată drept tratament sau sfat.","gd_st_h":"Niveluri de încredere","gd_st_draft":"schiță: introdusă, încă necontrolată de altcineva.","gd_st_sourced":"cu sursă: preluată dintr-o sursă publicată, cu adresa ei web.","gd_st_reviewed":"revizuit: confirmat de o altă persoană decât cea care l-a introdus, care și-a spus numele.","gd_lic_h":"Licențe","gd_lic":"Codul este MIT. O intrare fără câmp de licență are aceeași licență; o intrare poate declara public-domain, CC0-1.0 sau CC-BY-SA-4.0 (echivalentele englezești luate din Wikiquote sunt CC-BY-SA-4.0).","gd_static_h":"Proverbul zilei ca pagină statică","gd_static":"node scripts/potd.mjs scrie o pagină HTML mică cu proverbul unei date (azi, implicit), după aceeași regulă ca fila Proverbul zilei; rulează-l zilnic ca să-l publici.","h_limits":"Ce nu face această pagină","lim_1":"Datele de pornire sunt puține: zece proverbe românești luate de pe pagina Wikiquote „Romanian proverbs”, cu sursele lor, fără descântece, ghicitori sau colinde și fără județ. Ce se adaugă după aceea este atât de sigur cât este sursa lui.","lim_2":"Nicio intrare din datele de pornire nu a fost revizuită de un folclorist sau de un vorbitor nativ; cele marcate „revizuit” spun cine le-a revizuit. „Cu sursă” înseamnă doar că e citată o sursă. Textele interfeței în alte limbi decât engleza și româna au fost scrise cu un asistent IA și cer revizuire de către vorbitori nativi.","lim_3":"Plăcile județelor sunt o schemă, nu o hartă: fără granițe, iar pozițiile urmează doar aproximativ aranjamentul real. O intrare apare pe o placă doar dacă i s-a notat județul.","lim_4":"Ce adaugi rămâne în acest browser până îl descarci; ștergerea datelor site-ului îl șterge. Nu se trimite nimic nicăieri.","lim_5":"Detectarea duplicatelor compară literele, fără diacritice, majuscule și punctuație; nu poate ști că două proverbe cu cuvinte diferite au același sens.","lim_6":"Pagina nu poate verifica dacă acordul a fost cu adevărat dat: asta cade în sarcina celui care a cules textul."},"en":{"nav":"Folklore","title":"An open archive of folklore: proverbs, charms, riddles and carols, each with region and source","open":"Open the archive","intro":"Search proverbs, charms, riddles and carols by words, type, language, region or county; read the proverb of the day; see on a schematic map how many entries each county has; add your own entries with their source and consent, check for duplicates and download them to send to the project. Everything runs in your browser; nothing is sent anywhere.","tab_search":"Search","tab_today":"Proverb of the day","tab_map":"Map","tab_add":"Add","tab_export":"Export","tab_guide":"Guide","t_proverb":"proverb","t_charm":"charm","t_riddle":"riddle","t_carol":"carol","t_tale":"tale","t_saying":"saying","t_lullaby":"lullaby","st_draft":"draft","st_sourced":"sourced","st_reviewed":"reviewed","cn_published":"from a published work","cn_informed":"informed consent of the bearer","cn_anonymised":"consent, name withheld","s_q_l":"Words from the text, translation, answer, region or county (diacritics do not matter)","s_type_l":"Type","s_all_types":"All types","s_lang_l":"Language","s_all_langs":"All languages","s_region_l":"Region","s_all_regions":"All regions","s_county_l":"County","s_all_counties":"All counties","s_status_l":"Reliability","s_st_any":"any (including drafts)","s_st_sourced":"sourced or reviewed","s_st_reviewed":"reviewed only","s_count":"Results: {0}","s_none":"Nothing found. Try fewer words or clear the filters.","s_more":"Show more ({0} left)","s_reveal":"Show the answer","s_hide":"Hide the answer","s_answer":"Answer","s_purpose":"Purpose","s_charm_note":"A charm belongs to a living tradition; it is shown as heritage, not as medical or other advice.","s_yours":"your entry","s_unlocated":"place not recorded","s_src":"Source","s_lic":"Licence","s_consent":"Consent","s_by":"Collected by {0}","s_tr":"Translation","s_notes":"Notes","s_newtab":"(opens in a new tab)","d_date_l":"Date","d_hint":"Format: YYYY-MM-DD","d_prev":"Previous day","d_next":"Next day","d_today":"Today","d_none":"There are no proverbs yet.","d_bad":"That is not a valid date (use YYYY-MM-DD).","d_note":"The pick depends only on the date and on the proverbs in the page’s collection, not on your own entries, so every device shows the same proverb on the same day.","m_h":"Entries by county","m_note":"Schematic tiles, not a geographic map: one tile per county, placed so that neighbours stay roughly where they are.","m_help":"Choose a tile to see that county’s entries in the Search tab.","m_cnt":"entries: {0}","m_nocounty":"{0} of {1} entries have no county recorded.","m_sel":"Showing the entries of {0}.","m_all":"Show all counties","a_h":"Add an entry","a_intro":"What you add stays in this browser until you download it. Give the source, and the bearer’s consent when it comes from a living person.","a_lang_l":"Language code of the text (ro, hu, rom …)","a_text_l":"Text, as it is said","a_region_l":"Region (for example Moldova; leave empty if unknown)","a_county_l":"County (optional)","a_none":"— none —","a_tr_l":"Translations, one per line: language code, colon, text (en: …)","a_answer_l":"Answer to the riddle","a_purpose_l":"What the charm is said for (a few words)","a_notes_l":"Notes (optional)","a_source_l":"Source (a book, a page, or whom you heard it from)","a_url_l":"Web address of the source (https://, optional)","a_lic_l":"Licence of this entry","a_lic_def":"as the project (MIT)","a_consent_l":"Consent (required for charms and for anything you collected from a person)","a_collector_l":"Collected by (name or initials)","a_rev_l":"Reviewed by (name)","a_more":"More details","a_check":"Check","a_add":"Add to my list","a_add_any":"Add anyway","a_reset":"Clear the form","a_issues":"Fix these first:","issue_type":"Choose a type.","issue_lang":"The language code has 2 or 3 lowercase letters (ro, hu, rom).","issue_text":"The text is required (at most {0} characters, no control characters).","issue_region":"The region is one line of at most {0} characters.","issue_county":"Choose a county from the list.","issue_translations":"Translations: one per line, language code, colon, text (at most {0} languages).","issue_answer":"A riddle needs its answer (one line); only riddles have an answer.","issue_purpose":"A charm needs its purpose (one line); only charms have one.","issue_notes":"Notes have at most {0} characters.","issue_collector":"The collector’s name is one line of at most {0} characters.","issue_consent":"Charms, and anything collected from a person, need a consent entry.","issue_source":"The source is required (one line, at most {0} characters).","issue_source_url":"The web address must start with https://; an entry marked sourced needs one.","issue_license":"Choose a licence from the list.","issue_status":"Choose a reliability level.","issue_reviewed_by":"An entry marked reviewed needs the reviewer’s name (one line).","issue_other":"Something in this entry is not valid.","check_ok":"Looks good: nothing to fix.","dup_exact":"Already there: {0}","dup_near":"Very similar ({1}%): {0}","dup_hint":"If it is a different entry, use the Add anyway button.","a_added":"Added. You have {0} entries of your own.","a_full":"You already have {0} entries of your own; download them and clear the list first.","a_own_h":"Your entries ({0})","a_own_none":"You have not added anything yet.","a_remove":"Remove","a_remove_l":"Remove: {0}","a_remove_sure":"Press again to remove","a_removed":"Removed.","a_clear_all":"Remove all my entries","a_clear_sure":"Press again to remove all {0} entries","a_cleared":"Your entries were removed.","b_h":"Add many at once","b_help":"One entry per line: text | translation (the translation is optional; a tab also works). Type, language, region, county, source and licence come from the form above (at most {0} lines).","b_ta_l":"Entries, one per line","b_trl_l":"Language code of the translations","b_go":"Add all","b_done":"{0} added, {1} skipped.","b_line":"Line {0}: {1}","b_e_text":"the text is empty or contains control characters","b_e_translation":"the translation contains control characters","b_e_many":"too many lines; the rest were not read","b_e_dup":"already in the collection or earlier in the list","x_h":"Export and import","x_scope_l":"What the table contains","x_all":"the whole collection","x_own":"only my entries","x_json":"Download my entries as a contribution file (JSON)","x_tsv":"Download a table (TSV, opens in a spreadsheet)","x_none":"There is nothing to export.","x_done":"Downloaded: {0}","x_import_l":"Import a contribution file","x_dup_h":"Duplicates","x_dup_go":"Look for duplicates in the whole collection","x_dup_none":"No duplicates found.","x_dup_found":"Pairs found: {0}","x_dup_pair":"{0} ↔ {1} ({2}%)","x_dup_more":"… and {0} more","e_json":"That file is not valid JSON.","e_format":"That is not a GRAIUL contribution file (format graiul-bundle, version 1).","e_many":"The file has more than {0} entries; split it.","e_big":"The file is too large.","e_read":"The file could not be read.","e_quota":"The browser has no room to store more; download your entries and clear the list.","i_ok":"Imported {0} entries; {1} were already there.","i_bad":"Entry {0}: {1}","gd_h":"How to contribute","gd_1":"Choose the type and write the text exactly as it is said, with its diacritics; add the language code (ro, hu, rom …) and, if you know them, the region and the county.","gd_2":"Always give the source: a book or a web page (with its address), or the person you heard it from. A riddle needs its answer and a charm its purpose.","gd_3":"Press Check: the page lists what to fix and shows entries that are identical or very similar. Then press Add to my list; repeat for each entry.","gd_4":"Open the Export tab and download your entries as a contribution file; send it in an issue or a pull request. A maintainer imports it with scripts/import_bundle.py.","gd_5":"Prefer files? Copy data/items/example.json, fill it in, name it data/items/<language>-<first words>.json and run python scripts/validate.py.","gd_eth_h":"Collecting ethically","gd_eth_1":"Ask first: tell the person who tells you a text that it will be published with its source, under which licence, and that they can say no or ask to remain unnamed.","gd_eth_2":"Record the answer in the entry: informed means the bearer agreed, anonymised means agreed with the name withheld, published means taken from a published work. Charms always need one of the three.","gd_eth_3":"Respect what the bearer wants kept private: some charms are passed on only to certain people or at certain times; if you are asked not to publish, do not.","gd_eth_4":"Copy only what you may: public-domain works with their citation, your own collecting, or entries you have permission for. Do not copy a modern collection whole.","gd_eth_5":"A charm is shown as heritage. Write its purpose in a few words; never present it as treatment or advice.","gd_st_h":"Reliability levels","gd_st_draft":"draft: entered, not yet checked by anyone else.","gd_st_sourced":"sourced: taken from a published source whose web address is given.","gd_st_reviewed":"reviewed: confirmed by a person other than the one who entered it, who gave their name.","gd_lic_h":"Licences","gd_lic":"The code is MIT. An entry without a licence field is under the same licence; an entry may say public-domain, CC0-1.0 or CC-BY-SA-4.0 instead (the English equivalents taken from Wikiquote are CC-BY-SA-4.0).","gd_static_h":"Proverb of the day as a static page","gd_static":"node scripts/potd.mjs writes a small HTML page with the proverb of a date (today by default) using the same rule as the Proverb of the day tab; run it from a daily job to publish it.","h_limits":"What this page does not do","lim_1":"The starter data is small: ten Romanian proverbs taken from Wikiquote’s page “Romanian proverbs”, with their sources, without charms, riddles or carols and without a county. What is added later is only as reliable as its source.","lim_2":"No entry of the starter data has been reviewed by a folklorist or a native speaker; entries marked “reviewed” name who reviewed them. “Sourced” only means that a source is cited. The interface texts in languages other than English and Romanian were written with an AI assistant and need native review.","lim_3":"The county tiles are a schematic, not a map: no borders, and positions only roughly follow the real layout. An entry appears on a tile only if its county was recorded.","lim_4":"What you add stays in this browser until you download it; clearing the site’s data deletes it. Nothing is sent anywhere.","lim_5":"Duplicate detection compares letters, ignoring diacritics, capitals and punctuation; it cannot know that two proverbs with different words mean the same.","lim_6":"The page cannot check that consent was really given: that rests on the person who collected the text."},"fr":{"nav":"Folklore","title":"Une archive ouverte de folklore : proverbes, formules magiques, devinettes et chants, avec région et source","open":"Ouvrir l’archive","intro":"Cherchez des proverbes, formules magiques, devinettes et chants par mots, type, langue, région ou comté ; lisez le proverbe du jour ; voyez sur une carte schématique combien d’entrées compte chaque comté ; ajoutez vos propres entrées avec leur source et le consentement, vérifiez les doublons et téléchargez-les pour les envoyer au projet. Tout s’exécute dans votre navigateur ; rien n’est envoyé nulle part.","tab_search":"Recherche","tab_today":"Proverbe du jour","tab_map":"Carte","tab_add":"Ajout","tab_export":"Export","tab_guide":"Guide","t_proverb":"proverbe","t_charm":"formule magique","t_riddle":"devinette","t_carol":"chant de Noël","t_tale":"conte","t_saying":"dicton","t_lullaby":"berceuse","st_draft":"brouillon","st_sourced":"sourcé","st_reviewed":"relu","cn_published":"tiré d’une œuvre publiée","cn_informed":"consentement éclairé du détenteur","cn_anonymised":"consentement, nom non publié","s_q_l":"Mots du texte, de la traduction, de la réponse, de la région ou du comté (les diacritiques n’ont pas d’importance)","s_type_l":"Type","s_all_types":"Tous les types","s_lang_l":"Langue","s_all_langs":"Toutes les langues","s_region_l":"Région","s_all_regions":"Toutes les régions","s_county_l":"Comté (județ)","s_all_counties":"Tous les comtés","s_status_l":"Fiabilité","s_st_any":"toute (brouillons compris)","s_st_sourced":"sourcées ou relues","s_st_reviewed":"relues seulement","s_count":"Résultats : {0}","s_none":"Rien trouvé. Essayez avec moins de mots ou effacez les filtres.","s_more":"Afficher la suite ({0} restantes)","s_reveal":"Afficher la réponse","s_hide":"Masquer la réponse","s_answer":"Réponse","s_purpose":"Usage","s_charm_note":"Une formule magique relève d’une tradition vivante ; elle est présentée comme patrimoine, non comme conseil médical ou autre.","s_yours":"votre entrée","s_unlocated":"lieu non noté","s_src":"Source","s_lic":"Licence","s_consent":"Consentement","s_by":"Collecté par {0}","s_tr":"Traduction","s_notes":"Notes","s_newtab":"(s’ouvre dans un nouvel onglet)","d_date_l":"Date","d_hint":"Format : AAAA-MM-JJ","d_prev":"Jour précédent","d_next":"Jour suivant","d_today":"Aujourd’hui","d_none":"Il n’y a pas encore de proverbes.","d_bad":"Ce n’est pas une date valide (utilisez AAAA-MM-JJ).","d_note":"Le choix ne dépend que de la date et des proverbes de la collection de la page, pas de vos propres entrées : tous les appareils affichent le même proverbe le même jour.","m_h":"Entrées par comté","m_note":"Tuiles schématiques, pas une carte géographique : une tuile par comté, placées de façon que les voisins restent à peu près à leur place.","m_help":"Choisissez une tuile pour voir les entrées du comté dans l’onglet Recherche.","m_cnt":"entrées : {0}","m_nocounty":"{0} entrées sur {1} n’ont pas de comté noté.","m_sel":"Entrées affichées : {0}.","m_all":"Afficher tous les comtés","a_h":"Ajouter une entrée","a_intro":"Ce que vous ajoutez reste dans ce navigateur jusqu’à ce que vous le téléchargiez. Donnez la source et, si cela vient d’une personne vivante, le consentement du détenteur.","a_lang_l":"Code de la langue du texte (ro, hu, rom …)","a_text_l":"Texte, tel qu’on le dit","a_region_l":"Région (par exemple Moldova ; laissez vide si inconnue)","a_county_l":"Comté (facultatif)","a_none":"— aucun —","a_tr_l":"Traductions, une par ligne : code de langue, deux-points, texte (en: …)","a_answer_l":"Réponse de la devinette","a_purpose_l":"Pour quoi la formule se dit (quelques mots)","a_notes_l":"Notes (facultatif)","a_source_l":"Source (un livre, une page, ou la personne qui vous l’a dit)","a_url_l":"Adresse web de la source (https://, facultatif)","a_lic_l":"Licence de cette ent ecte ou des entrées pour lesquelles vous avez une permission. Ne copiez pas une collection moderne en entier.","gd_eth_5":"Une formule magique est présentée comme patrimoine. Écrivez son usage en quelques mots ; ne la présentez jamais comme un traitement ou un conseil.","gd_st_h":"Niveaux de fiabilité","gd_st_draft":"brouillon : saisie, pas encore vérifiée par quelqu’un d’autre.","gd_st_sourced":"sourcé : repris d’une source publiée dont l’adresse web est donnée.","gd_st_reviewed":"relu : confirmé par une autre personne que celle qui l’a saisi, qui a donné son nom.","gd_lic_h":"Licences","gd_lic":"Le code est MIT. Une entrée sans champ de licence relève de la même licence ; une entrée peut déclarer public-domain, CC0-1.0 ou CC-BY-SA-4.0 (les équivalents anglais pris sur Wikiquote sont en CC-BY-SA-4.0).","gd_static_h":"Proverbe du jour comme page statique","gd_static":"node scripts/potd.mjs écrit une petite page HTML avec le proverbe d’une date (aujourd’hui par défaut), selon la même règle que l’onglet Proverbe du jour ; lancez-le chaque jour pour le publier.","h_limits":"Ce que cette page ne fait pas","lim_1":"Les données de départ sont peu nombreuses : dix proverbes roumains pris sur la page Wikiquote « Romanian proverbs », avec leurs sources, sans formules magiques, devinettes ni chants et sans comté. Ce qui est ajouté ensuite n’est fiable que dans la mesure de sa source.","lim_2":"Aucune entrée des données de départ n’a été relue par un folkloriste ou un locuteur natif ; celles marquées « relu » disent qui les a relues. « Sourcé » signifie seulement qu’une source est citée. Les textes de l’interface dans d’autres langues que l’anglais et le roumain ont été écrits avec un assistant IA et demandent une relecture par des locuteurs natifs.","lim_3":"Les tuiles des comtés sont un schéma, pas une carte : sans frontières, et leurs positions ne suivent que grossièrement la disposition réelle. Une entrée n’apparaît sur une tuile que si son comté a été noté.","lim_4":"Ce que vous ajoutez reste dans ce navigateur jusqu’à ce que vous le téléchargiez ; effacer les données du site le supprime. Rien n’est envoyé nulle part.","lim_5":"La détection des doublons compare les lettres, sans tenir compte des diacritiques, des majuscules ni de la ponctuation ; elle ne peut pas savoir que deux proverbes aux mots différents ont le même sens.","lim_6":"La page ne peut pas vérifier que le consentement a vraiment été donné : cela relève de la personne qui a recueilli le texte."},"de":{"nav":"Folklore","title":"Ein offenes Folklore-Archiv: Sprichwörter, Zaubersprüche, Rätsel und Lieder – mit Region und Quelle","open":"Archiv öffnen","intro":"Suchen Sie Sprichwörter, Zaubersprüche, Rätsel und Lieder nach Wörtern, Art, Sprache, Region oder Kreis; lesen Sie das Sprichwort des Tages; sehen Sie auf einer schematischen Karte, wie viele Einträge jeder Kreis hat; ergänzen Sie eigene Einträge mit Quelle und Einwilligung, prüfen Sie Duplikate und laden Sie sie herunter, um sie dem Projekt zu schicken. Alles läuft in Ihrem Browser; nichts wird irgendwohin gesendet.","tab_search":"Suche","tab_today":"Sprichwort des Tages","tab_map":"Karte","tab_add":"Hinzufügen","tab_export":"Export","tab_guide":"Anleitung","t_proverb":"Sprichwort","t_charm":"Zauberspruch","t_riddle":"Rätsel","t_carol":"Weihnachtslied","t_tale":"Märchen","t_saying":"Redensart","t_lullaby":"Wiegenlied","st_draft":"Entwurf","st_sourced":"mit Quelle","st_reviewed":"geprüft","cn_published":"aus einem veröffentlichten Werk","cn_informed":"informierte Einwilligung der Überlieferungsträger","cn_anonymised":"Einwilligung, Name zurückgehalten","s_q_l":"Wörter aus Text, Übersetzung, Antwort, Region oder Kreis (Diakritika spielen keine Rolle)","s_type_l":"Art","s_all_types":"Alle Arten","s_lang_l":"Sprache","s_all_langs":"Alle Sprachen","s_region_l":"Region","s_all_regions":"Alle Regionen","s_county_l":"Kreis (județ)","s_all_counties":"Alle Kreise","s_status_l":"Zuverlässigkeit","s_st_any":"beliebig (auch En n suchen","x_dup_none":"Keine Duplikate gefunden.","x_dup_found":"Gefundene Paare: {0}","x_dup_pair":"{0} ↔ {1} ({2} %)","x_dup_more":"… und {0} weitere","e_json":"Diese Datei ist kein gültiges JSON.","e_format":"Das ist keine GRAIUL-Beitragsdatei (Format graiul-bundle, Version 1).","e_many":"Die Datei hat mehr als {0} Einträge; teilen Sie sie auf.","e_big":"Die Datei ist zu groß.","e_read":"Die Datei konnte nicht gelesen werden.","e_quota":"Der Browser hat keinen Speicherplatz mehr; laden Sie Ihre Einträge herunter und leeren Sie die Liste.","i_ok":"{0} Einträge importiert; {1} waren schon vorhanden.","i_bad":"Eintrag {0}: {1}","gd_h":"So tragen Sie bei","gd_1":"Wählen Sie die Art und schreiben Sie den Text genau so, wie er gesprochen wird, mit Diakritika; ergänzen Sie den Sprachcode (ro, hu, rom …) und, falls bekannt, Region und Kreis.","gd_2":"Geben Sie immer die Quelle an: ein Buch oder eine Webseite (mit Adresse) oder die Person, von der Sie es gehört haben. Ein Rätsel braucht seine Antwort, ein Zauberspruch seinen Zweck.","gd_3":"Drücken Sie Prüfen: Die Seite listet, was zu beheben ist, und zeigt identische oder sehr ähnliche Einträge. Drücken Sie dann Zu meiner Liste hinzufügen; wiederholen Sie das für jeden Eintrag.","gd_4":"Öffnen Sie den Reiter Export und laden Sie Ihre Einträge als Beitragsdatei herunter; schicken Sie sie in einem Issue oder Pull Request. Ein Maintainer importiert sie mit scripts/import_bundle.py.","gd_5":"Lieber Dateien? Kopieren Sie data/items/example.json, füllen Sie sie aus, nennen Sie sie data/items/<Sprache>-<erste Wörter>.json und führen Sie python scripts/validate.py aus.","gd_eth_h":"Ethisch sammeln","gd_eth_1":"Fragen Sie zuerst: Sagen Sie der Person, die Ihnen einen Text überliefert, dass er mit Quelle und unter welcher Lizenz veröffentlicht wird und dass sie ablehnen oder anonym bleiben darf.","gd_eth_2":"Halten Sie die Antwort im Eintrag fest: informed = die Überlieferungsträger haben zugestimmt, anonymised = zugestimmt, ohne Namen, published = aus einem veröffentlichten Werk. Zaubersprüche brauchen immer eine der drei.","gd_eth_3":"Respektieren Sie, was die Überlieferungsträger privat halten wollen: Manche Zaubersprüche werden nur an bestimmte Personen oder zu bestimmten Zeiten weitergegeben; wenn man Sie bittet, nicht zu veröffentlichen, tun Sie es nicht.","gd_eth_4":"Kopieren Sie nur, was erlaubt ist: gemeinfreie Werke mit Quellenangabe, Ihre eigene Sammlung oder Einträge, für die Sie eine Erlaubnis haben. Kopieren Sie keine moderne Sammlung als Ganzes.","gd_eth_5":"Ein Zauberspruch wird als Kulturerbe gezeigt. Schreiben Sie seinen Zweck in wenigen Wörtern; stellen Sie ihn nie als Behandlung oder Rat dar.","gd_st_h":"Zuverlässigkeitsstufen","gd_st_draft":"Entwurf: eingegeben, noch von niemand anderem geprüft.","gd_st_sourced":"mit Quelle: aus einer veröffentlichten Quelle übernommen, deren Webadresse angegeben ist.","gd_st_reviewed":"geprüft: von einer anderen Person als der eingebenden bestätigt, die ihren Namen angegeben hat.","gd_lic_h":"Lizenzen","gd_lic":"Der Code steht unter MIT. Ein Eintrag ohne Lizenzfeld hat dieselbe Lizenz; ein Eintrag kann stattdessen public-domain, CC0-1.0 oder CC-BY-SA-4.0 angeben (die von Wikiquote übernommenen englischen Entsprechungen stehen unter CC-BY-SA-4.0).","gd_static_h":"Sprichwort des Tages als statische Seite","gd_static":"node scripts/potd.mjs schreibt eine kleine HTML-Seite mit dem Sprichwort eines Datums (standardmäßig heute) nach derselben Regel wie der Reiter Sprichwort des Tages; führen Sie es täglich aus, um es zu veröffentlichen.","h_limits":"Was diese Seite nicht leistet","lim_1":"Die Startdaten sind knapp: zehn rumänische Sprichwörter von der Wikiquote-Seite „Romanian proverbs“, mit ihren Quellen, ohne Zaubersprüche, Rätsel oder Lieder und ohne Kreis. Was später hinzukommt, ist nur so verlässlich wie seine Quelle.","lim_2":"Kein Eintrag der Startdaten wurde von Folkloristen oder Muttersprachlern geprüft; als „geprüft“ markierte Einträge nennen, wer sie geprüft hat. „Mit Quelle“ heißt nur, dass eine Quelle genannt ist. Die Oberflächentexte in anderen Sprachen als Englisch und Rumänisch wurden mit einem KI-Assistenten geschrieben und brauchen eine Prüfung durch Muttersprachler.","lim_3":"Die Kreiskacheln sind ein Schema, keine Karte: ohne Grenzen, und die Positionen folgen der wirklichen Lage nur grob. Ein Eintrag erscheint nur dann auf einer Kachel, wenn sein Kreis erfasst wurde.","lim_4":"Was Sie hinzufügen, bleibt in diesem Browser, bis Sie es herunterladen; das Löschen der Website-Daten löscht es. Nichts wird irgendwohin gesendet.","lim_5":"Die Duplikaterkennung vergleicht Buchstaben und ignoriert Diakritika, Großschreibung und Satzzeichen; sie kann nicht wissen, dass zwei Sprichwörter mit verschiedenen Wörtern dasselbe bedeuten.","lim_6":"Die Seite kann nicht prüfen, ob die Einwilligung wirklich erteilt wurde: Das liegt bei der Person, die den Text gesammelt hat."},"es":{"nav":"Folclore","title":"Un archivo abierto de folclore: refranes, conjuros, adivinanzas y villancicos, con región y fuente","open":"Abrir el archivo","intro":"Busca refranes, conjuros, adivinanzas y villancicos por palabras, tipo, idioma, región o condado; lee el refrán del día; mira en un mapa esquemático cuántas entradas tiene cada condado; añade tus propias entradas con su fuente y el consentimiento, comprueba los duplicados y descárgalas para enviarlas al proyecto. Todo se ejecuta en tu navegador; no se envía nada a ninguna parte.","tab_search":"Búsqueda","tab_today":"Refrán del día","tab_map":"Mapa","tab_add":"Añadir","tab_export":"Exportar","tab_guide":"Guía","t_proverb":"refrán","t_charm":"conjuro","t_riddle":"adivinanza","t_carol":"villancico","t_tale":"cuento","t_saying":"dicho","t_lullaby":"nana","st_draft":"borrador","st_sourced":"con fuente","st_reviewed":"revisado","cn_published":"de una obra publicada","cn_informed":"consentimiento informado del portador","cn_anonymised":"consentimiento, nombre reservado","s ar una tabla (TSV, se abre en una hoja de cálculo)","x_none":"No hay nada que exportar.","x_done":"Descargado: {0}","x_import_l":"Importar un archivo de contribución","x_dup_h":"Duplicados","x_dup_go":"Buscar duplicados en toda la colección","x_dup_none":"No se encontraron duplicados.","x_dup_found":"Pares encontrados: {0}","x_dup_pair":"{0} ↔ {1} ({2} %)","x_dup_more":"… y {0} más","e_json":"Ese archivo no es JSON válido.","e_format":"No es un archivo de contribución de GRAIUL (formato graiul-bundle, versión 1).","e_many":"El archivo tiene más de {0} entradas; divídelo.","e_big":"El archivo es demasiado grande.","e_read":"No se pudo leer el archivo.","e_quota":"El navegador no tiene espacio para guardar más; descarga tus entradas y vacía la lista.","i_ok":"Se importaron {0} entradas; {1} ya estaban.","i_bad":"Entrada {0}: {1}","gd_h":"Cómo contribuir","gd_1":"Elige el tipo y escribe el texto tal como se dice, con sus signos diacríticos; añade el código de idioma (ro, hu, rom …) y, si los sabes, la región y el condado.","gd_2":"Da siempre la fuente: un libro o una página web (con su dirección) o la persona de quien lo oíste. Una adivinanza necesita su respuesta y un conjuro su finalidad.","gd_3":"Pulsa Comprobar: la página enumera lo que hay que corregir y muestra las entradas idénticas o muy parecidas. Luego pulsa Añadir a mi lista; repite con cada entrada.","gd_4":"Abre la pestaña Exportar y descarga tus entradas como archivo de contribución; envíalo en una issue o un pull request. Un responsable lo importa con scripts/import_bundle.py.","gd_5":"¿Prefieres archivos? Copia data/items/example.json, rellénalo, llámalo data/items/<idioma>-<primeras palabras>.json y ejecuta python scripts/validate.py.","gd_eth_h":"Recoger con ética","gd_eth_1":"Pregunta primero: di a la persona que te cuenta un texto que se publicará con su fuente, bajo qué licencia, y que puede negarse o pedir que no se la nombre.","gd_eth_2":"Anota la respuesta en la entrada: informed = el portador aceptó, anonymised = aceptó sin nombre, published = tomado de una obra publicada. Los conjuros siempre requieren una de las tres.","gd_eth_3":"Respeta lo que el portador quiere mantener en privado: algunos conjuros solo se transmiten a ciertas personas o en ciertos momentos; si te piden que no lo publiques, no lo hagas.","gd_eth_4":"Copia solo lo que puedes: obras de dominio público con su cita, tu propia recopilación o entradas con permiso. No copies entera una colección moderna.","gd_eth_5":"Un conjuro se muestra como patrimonio. Escribe su finalidad en pocas palabras; nunca lo presentes como tratamiento o consejo.","gd_st_h":"Niveles de fiabilidad","gd_st_draft":"borrador: introducida, aún sin revisar por otra persona.","gd_st_sourced":"con fuente: tomada de una fuente publicada cuya dirección web se indica.","gd_st_reviewed":"revisado: confirmado por una persona distinta de quien lo introdujo, que dio su nombre.","gd_lic_h":"Licencias","gd_lic":"El código es MIT. Una entrada sin campo de licencia tiene la misma licencia; una entrada puede declarar public-domain, CC0-1.0 o CC-BY-SA-4.0 (los equivalentes ingleses tomados de Wikiquote son CC-BY-SA-4.0).","gd_static_h":"Refrán del día como página estática","gd_static":"node scripts/potd.mjs escribe una página HTML pequeña con el refrán de una fecha (hoy por defecto) con la misma regla que la pestaña Refrán del día; ejecútalo a diario para publicarlo.","h_limits":"Lo que esta página no hace","lim_1":"Los datos iniciales son pocos: diez refranes rumanos tomados de la página de Wikiquote «Romanian proverbs», con sus fuentes, sin conjuros, adivinanzas ni villancicos y sin condado. Lo que se añada después es tan fiable como su fuente.","lim_2":"Ninguna entrada de los datos iniciales ha sido revisada por un folclorista ni por un hablante nativo; las marcadas como «revisado» dicen quién las revisó. «Con fuente» solo significa que se cita una fuente. Los textos de la interfaz en idiomas distintos del inglés y el rumano se escribieron con un asistente de IA y necesitan revisión por hablantes nativos.","lim_3":"Las casillas de los condados son un esquema, no un mapa: sin fronteras, y sus posiciones solo siguen aproximadamente la disposición real. Una entrada aparece en una casilla solo si se anotó su condado.","lim_4":"Lo que añades se queda en este navegador hasta que lo descargues; borrar los datos del sitio lo elimina. No se envía nada a ninguna parte.","lim_5":"La detección de duplicados compara letras, sin tener en cuenta diacríticos, mayúsculas ni puntuación; no puede saber que dos refranes con palabras distintas significan lo mismo.","lim_6":"La página no puede comprobar que el consentimiento se dio de verdad: eso depende de quien recogió el texto."},"it":{"nav":"Folklore","title":"Un archivio aperto di folklore: proverbi, incantesimi, indovinelli e canti, con regione e fonte","open":"Apri l’archivio","intro":"Cerca proverbi, incantesimi, indovinelli e canti per parole, tipo, lingua, regione o distretto; leggi il proverbio del giorno; guarda su una mappa schematica quante voci ha ogni distretto; aggiungi le tue voci con la fonte e il consenso, controlla i duplicati e scaricale per inviarle al progetto. Tutto gira nel tuo browser; non viene inviato nulla da nessuna parte.","tab_search":"Ricerca","tab_today":"Proverbio del giorno","tab_map":"Mappa","tab_add":"Aggiunta","tab_export":"Esporta","tab_guide":"Guida","t_proverb":"proverbio","t_charm":"incantesimo","t_riddle":"indovinello","t_carol":"canto natalizio","t_tale":"racconto","t_saying":"detto","t_lullaby":"ninna nanna","st_draft":"bozza","st_sourced":"con fonte","st_reviewed":"rivisto","cn_published":"da un’opera pubblicata","cn_informed":"consenso informato del portatore","cn_anonymised":"consenso, nome non pubblicato","s_q_l":"Parole del testo, della traduzione, della risposta, della regione o del distretto (i segni diacritici non contano)","s_type_l":"Tipo","s_all_types":"Tutti i tipi","s_lang_l":"Lingua","s_all_langs":"Tutt _status":"Scegli un livello di affidabilità.","issue_reviewed_by":"Una voce contrassegnata come rivista richiede il nome di chi l’ha rivista (una riga).","issue_other":"Qualcosa in questa voce non è valido.","check_ok":"Va bene: niente da correggere.","dup_exact":"Già presente: {0}","dup_near":"Molto simile ({1}%): {0}","dup_hint":"Se è un’altra voce, usa il pulsante Aggiungi comunque.","a_added":"Aggiunta. Hai {0} voci tue.","a_full":"Hai già {0} voci tue; scaricale e svuota prima l’elenco.","a_own_h":"Le tue voci ({0})","a_own_none":"Non hai ancora aggiunto nulla.","a_remove":"Rimuovi","a_remove_l":"Rimuovi: {0}","a_remove_sure":"Premi di nuovo per rimuovere","a_removed":"Rimossa.","a_clear_all":"Rimuovi tutte le mie voci","a_clear_sure":"Premi di nuovo per rimuovere tutte le {0} voci","a_cleared":"Le tue voci sono state rimosse.","b_h":"Aggiungi più voci insieme","b_help":"Una voce per riga: testo | traduzione (la traduzione è facoltativa; va bene anche una tabulazione). Tipo, lingua, regione, distretto, fonte e licenza vengono dal modulo qui sopra (al massimo {0} righe).","b_ta_l":"Voci, una per riga","b_trl_l":"Codice della lingua delle traduzioni","b_go":"Aggiungi tutte","b_done":"{0} aggiunte, {1} saltate.","b_line":"Riga {0}: {1}","b_e_text":"il testo è vuoto o contiene caratteri di controllo","b_e_translation":"la traduzione contiene caratteri di controllo","b_e_many":"troppe righe; il resto non è stato letto","b_e_dup":"già nella raccolta o più su nell’elenco","x_h":"Esportazione e importazione","x_scope_l":"Cosa contiene la tabella","x_all":"tutta la raccolta","x_own":"solo le mie voci","x_json":"Scarica le mie voci come file di contributo (JSON)","x_tsv":"Scarica una tabella (TSV, si apre in un foglio di calcolo)","x_none":"Non c’è nulla da esportare.","x_done":"Scaricato: {0}","x_import_l":"Importa un file di contributo","x_dup_h":"Duplicati","x_dup_go":"Cerca duplicati in tutta la raccolta","x_dup_none":"Nessun duplicato trovato.","x_dup_found":"Coppie che puoi: opere di pubblico dominio con la loro citazione, la tua raccolta o voci per cui hai un permesso. Non copiare per intero una raccolta moderna.","gd_eth_5":"Un incantesimo è mostrato come patrimonio. Scrivi il suo scopo in poche parole; non presentarlo mai come cura o consiglio.","gd_st_h":"Livelli di affidabilità","gd_st_draft":"bozza: inserita, non ancora controllata da altri.","gd_st_sourced":"con fonte: ripresa da una fonte pubblicata di cui è indicato l’indirizzo web.","gd_st_reviewed":"rivisto: confermato da una persona diversa da chi l’ha inserito, che ha indicato il proprio nome.","gd_lic_h":"Licenze","gd_lic":"Il codice è MIT. Una voce senza campo licenza ha la stessa licenza; una voce può dichiarare public-domain, CC0-1.0 o CC-BY-SA-4.0 (gli equivalenti inglesi presi da Wikiquote sono CC-BY-SA-4.0).","gd_static_h":"Proverbio del giorno come pagina statica","gd_static":"node scripts/potd.mjs scrive una piccola pagina HTML con il proverbio di una data (oggi per impostazione predefinita) con la stessa regola della scheda Proverbio del giorno; eseguilo ogni giorno per pubblicarlo.","h_limits":"Cosa non fa questa pagina","lim_1":"I dati iniziali sono pochi: dieci proverbi rumeni presi dalla pagina di Wikiquote «Romanian proverbs», con le loro fonti, senza incantesimi, indovinelli o canti e senza distretto. Ciò che si aggiunge dopo è affidabile quanto la sua fonte.","lim_2":"Nessuna voce dei dati iniziali è stata rivista da un folklorista o da un madrelingua; quelle contrassegnate «rivisto» dicono chi le ha riviste. «Con fonte» significa solo che è citata una fonte. I testi dell’interfaccia in lingue diverse dall’inglese e dal rumeno sono stati scritti con un assistente IA e richiedono la revisione di madrelingua.","lim_3":"Le tessere dei distretti sono uno schema, non una mappa: senza confini, e le posizioni seguono solo approssimativamente la disposizione reale. Una voce compare su una tessera solo se ne è stato indicato il distretto.","lim_4":"Ciò che aggiungi resta in questo browser finché non lo scarichi; cancellare i dati del sito lo elimina. Non viene inviato nulla da nessuna parte.","lim_5":"Il rilevamento dei duplicati confronta le lettere, ignorando segni diacritici, maiuscole e punteggiatura; non può sapere che due proverbi con parole diverse significano la stessa cosa.","lim_6":"La pagina non può verificare che il consenso sia stato davvero dato: questo spetta a chi ha raccolto il testo."},"hu":{"nav":"Folklór","title":"Nyílt folklórarchívum: közmondások, ráolvasások, találós kérdések és énekek, régióval és forrással","open":"Az archívum megnyitása","intro":"Keress közmondásokat, ráolvasásokat, találós kérdéseket és énekeket szavak, típus, nyelv, régió vagy megye szerint; olvasd el a nap közmondását; egy vázlatos térképen nézd meg, hány bejegyzése van az egyes megyéknek; vegyél fel saját bejegyzéseket forrással és beleegyezéssel, ellenőrizd az ismétlődéseket, és töltsd le őket, hogy elküldhesd a projektnek. Minden a böngésződben fut; semmi sem kerül sehová elküldésre.","tab_search":"Keresés","tab_today":"A nap közmondása","tab_map":"Térkép","tab_add":"Hozzáadás","tab_export":"Exportálás","tab_guide":"Útmutató","t_proverb":"közmondás","t_charm":"ráolvasás","t_riddle":"találós kérdés","t_carol":"kolinda","t_tale":"mese","t_saying":"szólás","t_lullaby":"altatódal","st_draft":"piszkozat","st_sourced":"forrással","st_reviewed":"ellenőrzött","cn_published":"megjelent műből","cn_informed":"a hagyományőrző tájékozott beleegyezése","cn_anonymised":"beleegyezés, név nélkül","s_q_l":"Szavak a szövegből, a fordításból, a válaszból, a régióból vagy a megyéből (az ékezetek nem számítanak)","s_type_l":"Típus","s_all_types":"Minden típus","s_lang_l":"Nyelv","s_all_langs":"Minden nyelv","s_region_l":"Régió","s_all_regions":"Minden régió","s_county_l":"Megye","s_all_counties":"Minden megye","s_status_l":"Megbízhatóság","s_st_any":"bármilyen (a piszkozatokkal együtt)","s_st_sourced":"forrással vagy ellenőrzött","s_st_revi ,"a_full":"Már {0} saját bejegyzésed van; előbb töltsd le őket, és ürítsd a listát.","a_own_h":"A bejegyzéseid ({0})","a_own_none":"Még nem adtál hozzá semmit.","a_remove":"Eltávolítás","a_remove_l":"Eltávolítás: {0}","a_remove_sure":"A törléshez nyomd meg újra","a_removed":"Eltávolítva.","a_clear_all":"Összes saját bejegyzés eltávolítása","a_clear_sure":"Nyomd meg újra mind a {0} bejegyzés eltávolításához","a_cleared":"A bejegyzéseid el lettek távolítva.","b_h":"Több hozzáadása egyszerre","b_help":"Soronként egy bejegyzés: szöveg | fordítás (a fordítás nem kötelező; tabulátor is jó). A típust, a nyelvet, a régiót, a megyét, a forrást és a licencet a fenti űrlapból vesszük (legfeljebb {0} sor).","b_ta_l":"Bejegyzések, soronként egy","b_trl_l":"A fordítások nyelvkódja","b_go":"Mind hozzáadása","b_done":"{0} hozzáadva, {1} kihagyva.","b_line":"{0}. sor: {1}","b_e_text":"a szöveg üres vagy vezérlőkaraktert tartalmaz","b_e_translation":"a fordítás vezérlőkaraktert tartalmaz","b_e_many":"túl sok sor; a többit nem olvastuk be","b_e_dup":"már szerepel a gyűjteményben vagy följebb a listában","x_h":"Exportálás és importálás","x_scope_l":"Mit tartalmaz a táblázat","x_all":"a teljes gyűjtemény","x_own":"csak a saját bejegyzéseim","x_json":"A saját bejegyzéseim letöltése hozzájárulási fájlként (JSON)","x_tsv":"Táblázat letöltése (TSV, táblázatkezelőben nyílik meg)","x_none":"Nincs mit exportálni.","x_done":"Letöltve: {0}","x_import_l":"Hozzájárulási fájl importálása","x_dup_h":"Ismétlődések","x_dup_go":"Ismétlődések keresése az egész gyűjteményben","x_dup_none":"Nem találtunk ismétlődést.","x_dup_found":"Talált párok: {0}","x_dup_pair":"{0} ↔ {1} ({2}%)","x_dup_more":"… és még {0}","e_json":"Ez a fájl nem érvényes JSON.","e_format":"Ez nem GRAIUL hozzájárulási fájl (graiul-bundle formátum, 1. verzió).","e_many":"A fájlban több mint {0} bejegyzés van; oszd fel.","e_big":"A fájl túl nagy.","e_read":"A fájlt nem sikerült beolvasni.","e_quota":"A böngészőben elfogyott a hely; töltsd le a bejegyzéseidet, és ürítsd a listát.","i_ok":"{0} bejegyzés importálva; {1} már megvolt.","i_bad":"{0}. bejegyzés: {1}","gd_h":"Hogyan segíthetsz","gd_1":"Válaszd ki a típust, és úgy írd le a szöveget, ahogy mondják, ékezetekkel; add meg a nyelvkódot (ro, hu, rom …), és ha tudod, a régiót és a megyét.","gd_2":"Mindig add meg a forrást: könyvet vagy weboldalt (a címével), vagy azt a személyt, akitől hallottad. A találós kérdéshez kell a megfejtés, a ráolvasáshoz a cél.","gd_3":"Nyomd meg az Ellenőrzés gombot: az oldal felsorolja a javítandókat, és megmutatja az azonos vagy nagyon hasonló bejegyzéseket. Utána nyomd meg a Hozzáadás a listámhoz gombot; ismételd minden bejegyzéssel.","gd_4":"Nyisd meg az Exportálás lapot, és töltsd le a bejegyzéseidet hozzájárulási fájlként; küldd el egy issue-ban vagy pull requestben. Egy karbantartó a scripts/import_bundle.py-vel importálja.","gd_5":"Inkább fájlokkal dolgoznál? Másold le a data/items/example.json fájlt, töltsd ki, nevezd el data/items/<nyelv>-<első szavak>.json néven, és futtasd a python scripts/validate.py parancsot.","gd_eth_h":"Etikus gyűjtés","gd_eth_1":"Előbb kérdezz: mondd meg annak, aki átad neked egy szöveget, hogy forrásával együtt, milyen licenccel jelenik meg, és hogy nemet mondhat, vagy kérheti, hogy ne nevezzék meg.","gd_eth_2":"Jegyezd fel a választ a bejegyzésben: informed = a hagyományőrző beleegyezett, anonymised = név nélkül egyezett bele, published = megjelent műből származik. A ráolvasásokhoz mindig kell a három közül egy.","gd_eth_3":"Tiszteld, amit a hagyományőrző titokban akar tartani: egyes ráolvasásokat csak bizonyos személyeknek vagy bizonyos időben adnak tovább; ha kérik, hogy ne tedd közzé, ne tedd.","gd_eth_4":"Csak azt másold, amit szabad: közkincs művek hivatkozással, saját gyűjtés vagy olyan bejegyzések, amelyekhez engedélyed van. Ne másolj le egy modern gyűjteményt egészében.","gd_eth_5":"A ráolvasás örökségként látható. Írd le a célját néhány szóval; soha ne mutasd kezelésként vagy tanácsként.","gd_st_h":"Megbízhatósági szintek","gd_st_draft":"piszkozat: bevitt, még senki más nem ellenőrizte.","gd_st_sourced":"forrással: közzétett forrásból, megadott webcímmel.","gd_st_reviewed":"ellenőrzött: a bevivőtől eltérő személy megerősítette, és megadta a nevét.","gd_lic_h":"Licencek","gd_lic":"A kód MIT licencű. A licencmező nélküli bejegyzésre ugyanez vonatkozik; egy bejegyzés megadhatja a public-domain, CC0-1.0 vagy CC-BY-SA-4.0 értéket is (a Wikiquote-ról átvett angol megfelelők CC-BY-SA-4.0 alatt állnak).","gd_static_h":"A nap közmondása statikus oldalként","gd_static":"A node scripts/potd.mjs egy kis HTML-oldalt ír egy dátum közmondásával (alapból a mai napéval), ugyanazzal a szabállyal, mint A nap közmondása lap; futtasd naponta a közzétételhez.","h_limits":"Amit ez az oldal nem tud","lim_1":"A kezdő adatok kevesek: tíz román közmondás a Wikiquote „Romanian proverbs” oldaláról, forrásaikkal, ráolvasás, találós kérdés vagy ének nélkül és megye nélkül. Ami később kerül hozzá, annyira megbízható, mint a forrása.","lim_2":"A kezdő adatok egyik bejegyzését sem ellenőrizte folklórkutató vagy anyanyelvi beszélő; az „ellenőrzött” jelölésűek megnevezik, ki ellenőrizte őket. A „forrással” csak annyit jelent, hogy van megadott forrás. Az angoltól és a romántól eltérő nyelvű felületi szövegeket MI-asszisztenssel írtuk, anyanyelvi ellenőrzésre szorulnak.","lim_3":"A megyecsempék vázlatok, nem térkép: határok nélkül, és a helyzetük csak nagyjából követi a valódi elrendezést. Egy bejegyzés csak akkor jelenik meg egy csempén, ha fel van tüntetve a megyéje.","lim_4":"Amit hozzáadsz, az ebben a böngészőben marad, amíg le nem töltöd; a webhelyadatok törlése törli. Semmi sem kerül sehová elküldésre.","lim_5":"Az ismétlődés-keresés a betűket hasonlítja össze, az ékezeteket, a nagybetűket és az írásjeleket figyelmen kívül hagyva; nem tudhatja, hogy két eltérő szavú közmondás ugyanazt jelenti.","lim_6":"Az oldal nem tudja ellenőrizni, hogy a beleegyezést valóban megadták-e: ez annak a felelőssége, aki a szöveget gyűjtötte."},"pt":{"nav":"Folclore","title":"Um arquivo aberto de folclore: provérbios, esconjuros, adivinhas e cantigas, com região e fonte","open":"Abrir o arquivo","intro":"Procure provérbios, esconjuros, adivinhas e cantigas por palavras, tipo, idioma, região ou distrito; leia o provérbio do dia; veja num mapa esquemático quantas entradas tem cada distrito; adicione entradas suas com a fonte e o consentimento, verifique os duplicados e descarregue-as para as enviar ao projeto. Tudo corre no seu navegador; nada é enviado para lado nenhum.","tab_search":"Pesquisa","tab_today":"Provérbio do dia","tab_map":"Mapa","tab_add":"Adicionar","tab_export":"Exportar","tab_guide":"Guia","t_proverb":"provérbio","t_charm":"esconjuro","t_riddle":"adivinha","t_carol":"cântico de Natal","t_tale":"conto","t_saying":"dito","t_lullaby":"canção de embalar","st_draft":"rascunho","st_sourced":"com fonte","st_reviewed":"revisto","cn_published":"de uma obra publicada","cn_informed":"consentimento informado do portador","cn_anonymised":"consentimento, nome omitido","s_q_l":"Palavras do texto, da tradução, da resposta, da região ou do distrito (os diacríticos não contam)","s_type_l":"Tipo","s_all_types":"Todos os tipos","s_lang_l":"Idioma","s_all_langs":"Todos os idiomas","s_region_l":"Região","s_all_regions":"Todas as regiões","s_county_l":"Distrito (județ)","s_all_counties":"Todos os distritos","s_status_l":"Fiabilidade","s_st_any":"qualquer (incluindo rascunhos)","s_st_sourced":"com fonte ou revistas","s_st_reviewed":"só revistas","s_count":"Resultados: {0}","s_none":"Nada encontrado. Tente menos palavras ou limpe os filtros.","s_more":"Mostrar mais (faltam {0})","s_reveal":"Mostrar a resposta","s_hide":"Ocultar a resposta","s_answer":"Resposta","s_purpose":"Finalidade","s_charm_note":"Um esconjuro pertence a uma tradição viva; é mostrado como património, não como conselho médico ou de outro tipo.","s_yours":"a sua entrada","s_unlocated": ear_sure":"Prima de novo para remover as {0} entradas","a_cleared":"As suas entradas foram removidas.","b_h":"Adicionar várias de uma vez","b_help":"Uma entrada por linha: texto | tradução (a tradução é opcional; um tabulador também serve). O tipo, o idioma, a região, o distrito, a fonte e a licença vêm do formulário acima (no máximo {0} linhas).","b_ta_l":"Entradas, uma por linha","b_trl_l":"Código do idioma das traduções","b_go":"Adicionar todas","b_done":"{0} adicionadas, {1} ignoradas.","b_line":"Linha {0}: {1}","b_e_text":"o texto está vazio ou contém caracteres de controlo","b_e_translation":"a tradução contém caracteres de controlo","b_e_many":"demasiadas linhas; o resto não foi lido","b_e_dup":"já existe na coleção ou mais acima na lista","x_h":"Exportar e importar","x_scope_l":"O que a tabela contém","x_all":"toda a coleção","x_own":"só as minhas entradas","x_json":"Descarregar as minhas entradas como ficheiro de contribuição (JSON)","x_tsv":"Descarregar uma tabela (TSV, abre numa folha de cálculo)","x_none":"Não há nada para exportar.","x_done":"Descarregado: {0}","x_import_l":"Importar um ficheiro de contribuição","x_dup_h":"Duplicados","x_dup_go":"Procurar duplicados em toda a coleção","x_dup_none":"Não foram encontrados duplicados.","x_dup_found":"Pares encontrados: {0}","x_dup_pair":"{0} ↔ {1} ({2}%)","x_dup_more":"… e mais {0}","e_json":"Esse ficheiro não é JSON válido.","e_format":"Não é um ficheiro de contribuição GRAIUL (formato graiul-bundle, versão 1).","e_many":"O ficheiro tem mais de {0} entradas; divida-o.","e_big":"O ficheiro é demasiado grande.","e_read":"Não foi possível ler o ficheiro.","e_quota":"O navegador não tem espaço para guardar mais; descarregue as suas entradas e limpe a lista.","i_ok":"Importadas {0} entradas; {1} já existiam.","i_bad":"Entrada {0}: {1}","gd_h":"Como contribuir","gd_1":"Escolha o tipo e escreva o texto exatamente como se diz, com os diacríticos; acrescente o código do idioma (ro, hu, rom …) e, se os souber, a região e o distrito.","gd_2":"Indique sempre a fonte: um livro ou uma página web (com o endereço) ou a pessoa de quem o ouviu. Uma adivinha precisa da resposta e um esconjuro da finalidade.","gd_3":"Prima Verificar: a página lista o que corrigir e mostra as entradas idênticas ou muito semelhantes. Depois prima Adicionar à minha lista; repita para cada entrada.","gd_4":"Abra o separador Exportar e descarregue as suas entradas como ficheiro de contribuição; envie-o numa issue ou num pull request. Um responsável importa-o com scripts/import_bundle.py.","gd_5":"Prefere ficheiros? Copie data/items/example.json, preencha-o, chame-lhe data/items/<idioma>-<primeiras palavras>.json e execute python scripts/validate.py.","gd_eth_h":"Recolher com ética","gd_eth_1":"Pergunte primeiro: diga à pessoa que lhe conta um texto que será publicado com a sua fonte, sob que licença, e que pode recusar ou pedir para não ser nomeada.","gd_eth_2":"Registe a resposta na entrada: informed = o portador aceitou, anonymised = aceitou sem nome, published = tirado de uma obra publicada. Os esconjuros exigem sempre uma das três.","gd_eth_3":"Respeite o que o portador quer manter privado: alguns esconjuros só se transmitem a certas pessoas ou em certos momentos; se lhe pedirem para não publicar, não publique.","gd_eth_4":"Copie só o que pode: obras de domínio público com a sua citação, a sua própria recolha ou entradas para as quais tem permissão. Não copie uma coleção moderna inteira.","gd_eth_5":"Um esconjuro é mostrado como património. Escreva a sua finalidade em poucas palavras; nunca o apresente como tratamento ou conselho.","gd_st_h":"Níveis de fiabilidade","gd_st_draft":"rascunho: introduzida, ainda não verificada por outra pessoa.","gd_st_sourced":"com fonte: retirada de uma fonte publicada cujo endereço web é indicado.","gd_st_reviewed":"revisto: confirmado por uma pessoa diferente da que o introduziu, que indicou o seu nome.","gd_lic_h":"Licenças","gd_lic":"O código é MIT. Uma entrada sem ca
